
services:
  # 1. Redis: Bộ đệm Metadata [cite: 25]
  redis_broker:
    image: redis:7.0-alpine
    container_name: edge_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
    restart: always
    networks:
      - edge_network

  # 2. MediaMTX: Streaming RTSP/WebRTC 
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: edge_streaming
    ports:
      - "8554:8554"   # RTSP TCP
      - "8554:8554/udp" # RTSP UDP
      - "8889:8889"   # WebRTC
      - "8189:8189/udp" # WebRTC ICE/UDP
      - "9997:9997"   # REST API
    volumes:
      - ./services/mediamtx/mediamtx.yml:/mediamtx.yml
    restart: always
    networks:
      - edge_network

  # 3. Backend: FastAPI [cite: 25]
  # Trong mạng Docker: redis_broker / postgres_db (tên service). Trình duyệt trên host: localhost:8000.
  backend:
    build: ./services/backend_fastapi
    container_name: edge_backend
    ports:
      - "8000:8000"
    depends_on:
      - redis_broker
      - postgres_db
    environment:
      - REDIS_HOST=redis_broker
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://admin:secretpassword@edge_postgres:5432/smart_camera_db
    restart: always
    networks:
      - edge_network

  # 4. PostgreSQL: Database [cite: 25]
  postgres_db:
    image: postgres:15-alpine
    container_name: edge_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: smart_camera_db
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    networks:
      - edge_network

  # 5. Frontend: Dashboard [cite: 29]
  # Trình duyệt gọi API/WebRTC qua cổng host (8000, 8889), không dùng tên container backend.
  # Build mới: docker compose up -d --build  (hoặc: docker compose build --no-cache frontend)
  frontend:
    build:
      context: ./services/frontend_dashboard
      args:
        NEXT_PUBLIC_EDGE_HOST: ${NEXT_PUBLIC_EDGE_HOST:-}
        NEXT_PUBLIC_API_PORT: ${NEXT_PUBLIC_API_PORT:-8000}
        NEXT_PUBLIC_MEDIAMTX_HTTP_PORT: ${NEXT_PUBLIC_MEDIAMTX_HTTP_PORT:-8889}
    container_name: edge_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - edge_network

  # 6. AI Worker (Bản OpenCV chạy CPU)
  # ai_worker:
  #   build: ./services/ai_opencv
  #   container_name: edge_ai_opencv
  #   # Tắt cấu hình GPU để chạy trên lap
  #   # runtime: nvidia 
  #   environment:
  #     - REDIS_HOST=redis_broker
  #     - RTSP_URL=rtsp://mediamtx:8554/cam1
  #     - TARGET_FPS=2 
  #   depends_on:
  #     - redis_broker
  #     - mediamtx
  #   networks:
  #     - edge_network

networks:
  edge_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: